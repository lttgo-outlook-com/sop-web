# Cloud Build config for `scripts/deploy.sh` (`gcloud builds submit .`).
#
# `gcloud builds submit` requires a build config in the source dir; without this
# file the submit step fails before any image is built. It builds the multi-stage
# Dockerfile (static site -> public/, search index -> dist/vault-index.json) and
# pushes the image to Artifact Registry. deploy.sh then runs
# `gcloud run deploy --no-iap` (auth is in-app via src/oauth.mjs, not Cloud Run IAP).
#
# Keep the image tag in sync with IMAGE in scripts/deploy.sh.
steps:
  - id: auth-registry
    name: gcr.io/cloud-builders/docker
    entrypoint: gcloud
    args: [auth, configure-docker, asia-southeast1-docker.pkg.dev, --quiet]
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag=asia-southeast1-docker.pkg.dev/obacker-ai/obk/sop-web:latest
      - -f=Dockerfile
      - .
images:
  - asia-southeast1-docker.pkg.dev/obacker-ai/obk/sop-web:latest
