name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  PROJECT_ID: obacker-ai
  REGION: asia-southeast1
  SERVICE_NAME: sop-web
  IMAGE_NAME: asia-southeast1-docker.pkg.dev/obacker-ai/obk/sop-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sop-web
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image=$IMAGE_NAME:${{ github.sha }} \
            --project=$PROJECT_ID \
            --region=$REGION \
            --platform=managed \
            --port=8080 \
            --no-allow-unauthenticated \
            --iap
